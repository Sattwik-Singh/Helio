name: Probe data
# Runs the first-contact data probe on a GitHub runner, which can reach NASA's
# CDAWeb, and commits the results to data/probe/ so they are visible in the repo.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/probe_hapi.py
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "Data probe results from CDAWeb"
          git push
